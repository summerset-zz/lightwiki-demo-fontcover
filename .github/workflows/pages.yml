# 构建文档中心并发布到 GitHub Pages。
#
# 工具从公开仓库临时取用（`git clone --depth 1`），不需要任何跨仓库凭据 ——
# 「内容仓库用自带 GITHUB_TOKEN 就能部署」这条约束的具体写法。
# 首次运行前要在 Settings → Pages 里把 Source 设成 "GitHub Actions"。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 工具从 npm 现取，不需要 install、不需要任何凭据。
      # 项目站点挂在 /<仓库名>/ 下，把仓库名注入给站点，否则产物里的链接会指到根目录。
      - name: 构建本站
        env:
          LIGHTWIKI_BASE_PATH: /${{ github.event.repository.name }}/
        run: npx --yes @lightwiki/cli@0.5.0 build .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
